[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "runlog"
version = "0.2.4"
description = "Check and tag multi-channel time-series test logs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Can Huang"}]
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=15"]

[project.urls]
Repository = "https://github.com/CabotHwang/runlog"
Issues = "https://github.com/CabotHwang/runlog/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
mysql = ["sqlalchemy>=2.0", "pymysql>=1.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "matplotlib>=3.8",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "ruff==0.15.9",
]

[project.scripts]
runlog = "runlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["runlog*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "A", "ICN"]

[tool.ruff.lint.flake8-bugbear]
# The default CheckConfig is frozen and contains only immutable values.
extend-immutable-calls = ["runlog.checks.CheckConfig"]
