[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runlog"
version = "0.1.0"
description = "Check and tag multi-channel time-series test logs."
requires-python = ">=3.10"
authors = [{name = "Can Huang"}]
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=15"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.8"]

[project.scripts]
runlog = "runlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
